[project]
name = "jarvis"
version = "0.1.0"
description = "A local, voice-driven personal agent for macOS"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "rich>=13.7",
]

[project.optional-dependencies]
voice = ["elevenlabs>=2.0", "sounddevice>=0.5", "numpy>=2.0"]
integrations = ["google-api-python-client>=2.0", "google-auth-oauthlib>=1.2"]
app = ["rumps>=0.4"]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]
